
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailScope | Railway Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>RailScope</h1>
        <p>Explore railway networks and discover connections.</p>
    </header>

    <main>

        <section id="search-section">
            <h2>Find a Station</h2>

            <input
                type="text"
                id="station-search"
                placeholder="Enter a station name..."
            >

            <div id="search-results"></div>
        </section>

        <section id="station-details">
            <h2>Station Information</h2>
            <p id="station-info">Select a station to explore it.</p>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
